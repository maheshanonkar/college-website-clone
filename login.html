<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="assets/icons/vacoe-logo.png">

    <title>Login</title>
</head>

<body>
    <header class="home_header">
        <section class="header_section">
            <div id="home_header_d1">
                <a href="assets/photos/vacoe-logo.png" target="_blank"><img src="assets/photos/vacoe-logo.png" alt="vacoe-logo"
                        id="vacoe-logo"></a>
            </div>
            <div id="home_header_d2">
                <h2>VISHWABHARTI ACADEMY COLLEGE OF ENGINEERING</h2>
                <p>AICTE Approved | DTE Mumbai Recognized</p>
                <p>Affliated to Savitribai Phule University</p>
            </div>
            <div id="home_header_d3">
                <a href="about.html">
                    <img src="assets/photos/b+grade.png" alt="grade" id="grade">
                </a>
            </div>
        </section>
    </header>

    <main>

        <section class="hero-section1">
            <nav id="navbar">
                <a href="index.html">HOME</a>
                <a href="contact.html">CONTACT</a>
                <a href="about.html">ABOUT</a>
                <a href="academics.html">ACADEMICS</a>
                <a href="facilities.html">FACILITIES</a>
                <a href="#" class="active">LOGIN</a>
            </nav>
        </section>

        <section class="login_section1">

            <div class="login_main_div">
                <div class="login_div" id="student_div">
                    <div class="login_headings">
                        <h2> STUDENT LOGIN  </h2>
                    </div>
                    <div>
                        <hr>
                    </div>
                    <div class="login_input_box">
                        <input type="text" id="student_name" required>
                        <label for="student_name_label">Student Name</label>
                    </div>
                    <div class="login_input_box">
                        <input type="email" id="student_email" required>
                        <label for="student_email_label">Student Label</label>
                    </div>
                    <div class="login_input_box">
                        <input type="text" id="student_phone" required>
                        <label for="student_phone_label">Student Phone Number</label>
                    </div>
                    <div class="login_input_box">
                        <input type="submit" value="SUBMIT" id="login_submit">
                    </div>
                </div>

                <div class="login_div" id="faculty_div">
                    <div class="login_headings">
                        <h2>FACULTY LOGIN </h2>
                    </div>
                    <div>
                        <hr>
                    </div>
                    <div class="login_input_box">
                        <input type="text" id="faculty_id" required>
                        <label for="faculty_id_label">Faculty ID</label>
                    </div>
                    <div class="login_input_box">
                        <input type="text" id="faculty_name" required>
                        <label for="faculty_name_label">Faculty Name</label>
                    </div>
                    <div class="login_input_box">
                        <input type="text" id="faculty_branch" required>
                        <label for="faculty_branch_label">Faculty Branch</label>
                    </div>
                    <div class="login_input_box">
                        <input type="text" id="faculty_phone" required>
                        <label for="faculty_phone_label">Faculty Phone Number</label>
                    </div>
                    <div class="login_input_box">
                        <input type="submit" value="SUBMIT" id="login_submit">
                    </div>
                </div>

                <div class="login_div" id="parent_div">
                    <div class="login_headings">
                        <h2>PARENT LOGIN </h2>
                    </div>
                    <div>
                        <hr>
                    </div>
                    <div class="login_input_box">
                        <input type="text" id="parent_name" required>
                        <label for="parent_name_label">Parent Name</label>
                    </div>
                    <div class="login_input_box">
                        <input type="text" id="parent_phone" required>
                        <label for="parent_phone_label">Parent Phone</label>
                    </div>
                    <div class="login_input_box">
                        <input type="submit" value="SUBMIT" id="login_submit">
                    </div>
                </div>
            </div>

        </section>


    </main>

    <script src="assets/script.js"></script>
</body>

</html>
